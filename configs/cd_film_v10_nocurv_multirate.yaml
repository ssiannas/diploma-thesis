# FiLM v10 nocurv multi-rate -- extend single-rate nocurv winner to r2+r4+r6
# nocurv r2-only beats curvature model at all rates (+2.09 edge vs +1.62).
# Same architecture as v10 head but no curvature (in_channels=3).
# Warm-start from nocurv best checkpoint, fresh optimizer for multi-rate.
data:
  rates: [r2, r4, r6]
  frame_stride: 12
  augment: true
  use_curvature: false
  rate_jitter: 0.0

model:
  model_type: film_head_v2
  max_displacement: 5.0
  film_embed_dim: 64
  film_rate_repr: bpp

loss:
  loss_type: cd
  chamfer_padding: 0
  cd_fwd_weight: 1.0
  cd_rev_weight: 1.0
  rate_weights: [1.0, 0.3, 0.05]

batch_size: 42  # lab-pc: 7.7/24GB at this size, could go higher but left as-is
lr: 1e-4
weight_decay: 1e-4
warmup_epochs: 3
epochs: 30
num_workers: 2
encoder_lr_scale: 1.0
pretrained_backbone: models/postprocessing/good_candidates/film_v10_head_ep24.pt
save_dir: models/postprocessing/film_v10_nocurv_multirate
log_file: logs/film_v10_nocurv_multirate.log

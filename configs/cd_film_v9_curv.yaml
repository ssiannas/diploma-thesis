# FiLM v9: Full FiLM conditioning + curvature input + Fourier rate encoding
# vs v6 (film_head, no curv, bpp+jitter): switches to full FiLM so rate
# conditioning permeates all encoder/decoder blocks -- enables suppressing
# displacement at r6 rather than just scaling a rate-blind backbone output.
# Curvature gives the model edge/flat signal in the input features.
# Fourier encoding replaces log(bpp) scalar with 8-dim sinusoidal features.
data:
  rates: [r2, r4, r6]
  frame_stride: 12
  augment: true
  use_curvature: true
  rate_jitter: 0.0

model:
  model_type: film
  film_rate_repr: bpp
  film_embed_dim: 64

loss:
  loss_type: cd

batch_size: 42
lr: 5e-4
weight_decay: 1e-4
warmup_epochs: 3
epochs: 30

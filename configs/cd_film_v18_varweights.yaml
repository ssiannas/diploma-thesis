# FiLM v18 -- nocurv + data-derived weights [1.0, 0.5, 0.3], full batch_size
#
# Fix for v16: identical to v10_nocurv_multirate (batch_size=42, pretrained_backbone=
# film_v10_head_ep24.pt, fresh optimizer) but with rate_weights=[1.0, 0.5, 0.3].
# v16 used batch_size=16 which under-utilises GPU vs v10's winning batch_size=42.
#
# Weights are data-derived: w_i = Var(||GT_displacement||) per rate, normalized:
#   r2: var=0.0412 -> w=1.000
#   r4: var=0.0205 -> w=0.497 -> rounded to 0.5
#   r6: var=0.0127 -> w=0.308 -> rounded to 0.3
# vs v10 [1.0, 0.3, 0.05] which over-suppresses r4/r6 by 2-6x vs data optimum.
data:
  rates: [r2, r4, r6]
  frame_stride: 12
  augment: true
  use_curvature: false
  rate_jitter: 0.0

model:
  model_type: film_head_v2
  max_displacement: 5.0
  film_embed_dim: 64
  film_rate_repr: bpp

loss:
  loss_type: cd
  chamfer_padding: 0
  cd_fwd_weight: 1.0
  cd_rev_weight: 1.0
  rate_weights: [1.0, 0.5, 0.3]

batch_size: 42
lr: 1e-4
weight_decay: 1e-4
warmup_epochs: 3
epochs: 30
num_workers: 2
encoder_lr_scale: 1.0
pretrained_backbone: models/postprocessing/good_candidates/film_v10_head_ep24.pt
save_dir: models/postprocessing/film_v18_varweights
log_file: logs/film_v18_varweights.log

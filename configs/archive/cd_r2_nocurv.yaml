# Single-rate r2 baseline WITHOUT curvature (3ch input)
# For two-stage training: this backbone can be frozen for FiLM multi-rate
data:
  rates: [r2]
  frame_stride: 12
  augment: true
  use_curvature: false
  max_clouds: 20

model:
  model_type: unet

loss:
  loss_type: cd

batch_size: 16
lr: 1e-4
weight_decay: 1e-4
warmup_epochs: 3
epochs: 30

# FiLM v13 Phase 2 -- CE-dominant focal training, full unfreeze
# Resume from Phase 1 best. Full backbone unfreezes with discriminative LR.
# Backbone at 1e-5 (encoder_lr_scale=0.1 * lr=1e-4), head at 1e-4.
data:
  rates: [r2, r4, r6]
  frame_stride: 12
  augment: true
  use_curvature: true
  rate_jitter: 0.0

model:
  model_type: film_head_v3
  max_displacement: 5.0
  film_embed_dim: 64
  film_rate_repr: bpp

loss:
  loss_type: cd
  chamfer_padding: 0
  cd_fwd_weight: 1.0
  cd_rev_weight: 1.0
  rate_weights: [1.0, 0.3, 0.05]
  ce_weight: 1.0
  ce_focal_gamma: 2.0
  cd_loss_scale: 0.1

batch_size: 42
lr: 1e-4
weight_decay: 1e-4
warmup_epochs: 3
epochs: 30
num_workers: 8
encoder_lr_scale: 0.1  # backbone at 1e-5, head at 1e-4
resume: models/postprocessing/film_v13_focal_p1/best_r2_r4_r6.pt
save_dir: models/postprocessing/film_v13_focal_p2
log_file: logs/film_v13_focal_p2.log

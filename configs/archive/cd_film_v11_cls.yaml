# FiLM v11 -- integer-class displacement head
# 3 x 11-way softmax over {-5,...,+5} per dimension.
# Training: soft expectation (differentiable) for CD loss.
# Inference: argmax -> exact integer output, zero train-test mismatch.
# Backbone init from v10 head ep24 (strict=False loads shared weights only).
data:
  rates: [r2, r4, r6]
  frame_stride: 12
  augment: true
  use_curvature: true
  rate_jitter: 0.0

model:
  model_type: film_head_v3
  max_displacement: 5.0
  film_embed_dim: 64
  film_rate_repr: bpp

loss:
  loss_type: cd
  chamfer_padding: 0
  cd_fwd_weight: 1.0
  cd_rev_weight: 1.0
  rate_weights: [1.0, 0.3, 0.05]

batch_size: 42
lr: 5e-4
weight_decay: 1e-4
warmup_epochs: 3
epochs: 30
num_workers: 8
pretrained_backbone: models/postprocessing/good_candidates/film_v10_head_ep24.pt
save_dir: models/postprocessing/film_v11_cls
log_file: logs/film_v11_cls.log

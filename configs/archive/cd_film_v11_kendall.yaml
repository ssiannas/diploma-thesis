# FiLM v11: Kendall learned rate weighting (replaces static [1.0, 0.3, 0.05])
# Hypothesis: network learns sigma_r2 < sigma_r4 < sigma_r6 from data,
# matching GT displacement density (r2=40% non-zero, r4=21%, r6=11%).
# Architecture identical to v10 -- only loss weighting changes.
data:
  rates: [r2, r4, r6]
  frame_stride: 12
  augment: true
  use_curvature: true
  rate_jitter: 0.0

model:
  model_type: film_head_v2
  film_rate_repr: bpp
  film_embed_dim: 64

loss:
  loss_type: cd
  use_kendall_rates: true
  rate_weights: [1.0, 0.3, 0.05]  # used as Kendall initialization prior, then learned

batch_size: 42
lr: 5e-4
weight_decay: 1e-4
warmup_epochs: 3
epochs: 30

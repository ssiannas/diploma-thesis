# FiLM v11 cls -- Phase 2: full network fine-tune
# Resume from phase 1 best checkpoint with backbone unfrozen.
# Lower LR to avoid destroying cls_head learned in phase 1.
# Backbone adapts its geometric prior to the integer-grid classification task.
data:
  rates: [r2, r4, r6]
  frame_stride: 12
  augment: true
  use_curvature: true
  rate_jitter: 0.0

model:
  model_type: film_head_v3
  max_displacement: 5.0
  film_embed_dim: 64
  film_rate_repr: bpp

loss:
  loss_type: cd
  chamfer_padding: 0
  cd_fwd_weight: 1.0
  cd_rev_weight: 1.0
  rate_weights: [1.0, 0.3, 0.05]

batch_size: 42
lr: 1e-4
weight_decay: 1e-4
warmup_epochs: 2
epochs: 20
num_workers: 8
encoder_lr_scale: 0.1  # backbone LR = 1e-5, head LR = 1e-4
# No pretrained_backbone -- backbone unfrozen, resume sets all weights
save_dir: models/postprocessing/film_v11_cls_p2
log_file: logs/film_v11_cls_p2.log
